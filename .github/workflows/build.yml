
name: Build NX AIM PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NX-AIM-PRO-APK
          path: bin/*.apk
